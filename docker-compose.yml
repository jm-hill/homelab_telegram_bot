version: '3.8'

services:

  keystone-alert-bot:
    image: git.your.domain/user/telegram_bot:latest
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy: { condition: any, delay: 10s, max_attempts: 5, window: 120s }
      labels:
        # for webhook access via traefik
        - "traefik.enable=true"
        - "traefik.http.routers.alerts.rule=Host(`alerts.your.domain`)"
        - "traefik.http.routers.alerts.entrypoints=websecure"
        - "traefik.http.routers.alerts.tls=true"
        - "traefik.http.services.alerts.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [app_overlay]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks: # uses an existing network
  app_overlay:
    external: true